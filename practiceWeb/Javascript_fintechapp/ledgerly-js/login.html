<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Ledgerly</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="navbar">
    <h1 class="brand">ledger<span>ly</span></h1>
    <nav>
      <a href="index.html">Home</a>
      <a class="nav-cta" href="register.html">Open account</a>
      <div class="settings-wrap"><button class="settings-toggle" type="button" data-settings-toggle aria-label="Open settings" aria-expanded="false">&#9881;</button><div class="settings-panel" data-settings-panel hidden><h3 data-copy="settings">Settings</h3><label data-copy="background">Background</label><div class="theme-options"><button class="theme-option selected" type="button" data-theme="paper">Paper</button><button class="theme-option" type="button" data-theme="sunset">Sunset</button><button class="theme-option" type="button" data-theme="night">Night</button></div><label for="language" data-copy="language">Language</label><select id="language" data-language><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div></div>
    </nav>
  </header>

  <main class="form-container">

    <div class="eyebrow">Welcome back</div>
    <h2>Sign in to Ledgerly</h2>
    <p>Your financial overview is waiting.</p>
    <form id="loginForm">

      <label for="loginEmail">Email address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" required>

      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" placeholder="Enter your password" required>

      <button type="submit">Sign in</button>
      <p class="form-note">New to Ledgerly? <a href="register.html">Create an account</a></p>

    </form>

  </main>
  <div id="toast" class="toast"></div>
  <div class="cursor-spot" data-cursor-spot></div>
  
  <script src="js/app.js"></script>
</body>
</html>
