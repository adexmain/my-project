<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open an account | Ledgerly</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="navbar">
    <h1 class="brand">ledger<span>ly</span></h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Sign in</a>
      <div class="settings-wrap"><button class="settings-toggle" type="button" data-settings-toggle aria-label="Open settings" aria-expanded="false">&#9881;</button><div class="settings-panel" data-settings-panel hidden><h3 data-copy="settings">Settings</h3><label data-copy="background">Background</label><div class="theme-options"><button class="theme-option selected" type="button" data-theme="paper">Paper</button><button class="theme-option" type="button" data-theme="sunset">Sunset</button><button class="theme-option" type="button" data-theme="night">Night</button></div><label for="language" data-copy="language">Language</label><select id="language" data-language><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div></div>
    </nav>
  </header>

  <main class="form-container">

    <div class="eyebrow">Start fresh</div>
    <h2>Open your account</h2>
    <p>It takes less than two minutes to get set up.</p>
    <form id="registerForm">

      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Alex Morgan" required>

      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Choose a secure password" minlength="6" required>

      <label for="userType">I am using Ledgerly as a</label>
      <select id="userType">
        <option value="">Select User Type</option>
        <option value="student">Student</option>
        <option value="professional">Professional</option>
        <option value="business">Business Owner</option>
      </select>

      <button type="submit">Create account</button>
      <p class="form-note">Already have an account? <a href="login.html">Sign in</a></p>

    </form>

  </main>
  <div id="toast" class="toast"></div>
  <div class="cursor-spot" data-cursor-spot></div>
  
  <script src="js/app.js"></script>
</body>
</html>
